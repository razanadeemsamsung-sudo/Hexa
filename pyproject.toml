[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "photomerge"
version = "2.0.0"
description = "Merge up to 2000 photos into a single TIFF without reducing resolution"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0", "numpy>=1.23", "tifffile>=2023.7.10"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
photomerge = "photomerge.cli:main"

[tool.setuptools]
packages = ["photomerge"]
